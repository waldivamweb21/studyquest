<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyQuest</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#526de5"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#17233f;--mut:#657087;--line:#e3e8f2;--blue:#526de5;--ok:#249b70;--bad:#d9534f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1524;--card:#192036;--ink:#e8ecf8;--mut:#93a0bd;--line:#2a3350}}
:root[data-theme="dark"]{--bg:#0f1524;--card:#192036;--ink:#e8ecf8;--mut:#93a0bd;--line:#2a3350}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 12px 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1}
.pomo{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 8px}
.pomo b{font-variant-numeric:tabular-nums;font-size:16px}.pomo small{color:var(--mut);font-size:10px;text-transform:uppercase;font-weight:700}
.pomo.brk{border-color:var(--ok)}
#ps{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:none;gap:8px;flex-wrap:wrap;font-size:12px}
#ps label{display:flex;align-items:center;gap:4px}#ps input[type=number]{width:52px}
button{font:inherit;color:var(--ink);cursor:pointer}
.pri,.ghost,.sm{border-radius:10px;border:1px solid var(--line);padding:9px 14px;background:var(--card)}
.pri{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:650}.sm{padding:3px 9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0;text-align:center}.grid b{font-size:22px;display:block}
.mut,small{color:var(--mut)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0}.seg button{flex:1;border:0;background:var(--card);padding:8px 4px;font-size:12px}.seg .on{background:var(--blue);color:#fff}
select,textarea{width:100%;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:4px 0;font:inherit}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin:6px 0;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.opt.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset}.opt.ok{border-color:var(--ok);background:rgba(36,155,112,.15)}.opt.bad{border-color:var(--bad);background:rgba(217,83,79,.15)}
.st,.ex{white-space:pre-line}.ex{font-size:13px;color:var(--mut);border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.row{display:flex;gap:8px;justify-content:space-between;margin-top:10px}.bar{display:flex;justify-content:space-between}
.don{display:flex;flex-direction:column;align-items:center}.don svg{width:140px;height:140px}.lg{width:100%;font-size:12px}.lg div{display:flex;gap:6px;padding:1px 0}.lg i{width:10px;height:10px;border-radius:50%;margin-top:4px;flex:none}.lg span{flex:1}
table{width:100%;font-size:12px;border-collapse:collapse}td,th{padding:5px 3px;border-bottom:1px solid var(--line);text-align:left}
input.fi{width:100%;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:4px 0 8px;font:inherit}
.exf label{display:block;font-size:12px;color:var(--mut);margin-top:8px}details summary{cursor:pointer;margin-top:10px}
.dg{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.day{display:inline-block;width:20px;height:20px;border-radius:5px;flex:none}
.d-g{background:#249b70}.d-r{background:#d9534f}.d-y{background:#e0a030}.d-f{background:rgba(147,160,189,.3)}
.d-x{background:#8b5cf6;box-shadow:0 0 0 2px var(--card),0 0 0 4px #8b5cf6}
.dl{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--mut);margin:4px 0 6px}.dl .day{width:11px;height:11px;border-radius:3px;margin-right:5px;box-shadow:none;vertical-align:middle}
.exm{text-align:center}.ex-name{font-size:18px;font-weight:700;margin-top:6px}.ex-count{font-size:16px;font-weight:700;margin:10px 0}
.ex-count.ok{color:#249b70}.ex-count.warn{color:#e0803a}.ex-count.today{color:#8b5cf6}.ex-count.past,.ex-count.none{color:var(--mut)}
.exm details{text-align:left}
.sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;flex:none;margin-top:0}
/* 2.7: flashcards no celular */
.ch{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:18px;padding:7px 12px;font-size:13px;cursor:pointer}
.ch.on{background:#526de5;border-color:#526de5;color:#fff;font-weight:650}
.chs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fcm{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;gap:10px}
.fcr{display:flex;flex-direction:column;gap:4px}.fcr>b{font-size:13px;color:var(--mut)}
.fcgo{width:100%;margin-bottom:10px}
.fcal{border-color:#526de5}
textarea.fi{width:100%;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:4px 0 10px;font:inherit;resize:vertical}
.fl{display:block;font-size:12px;color:var(--mut);margin-top:6px}
.fcf{font-size:19px;line-height:1.6;white-space:pre-wrap;margin:12px 0}
.fcb{font-size:16px;line-height:1.6;white-space:pre-wrap;border-top:2px dashed var(--line);padding-top:14px;margin-top:6px}
.fcg{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.fcg button{padding:11px;border-radius:12px;font-weight:650;border:2px solid;background:transparent;text-align:left;display:flex;flex-direction:column;gap:2px;font:inherit;cursor:pointer}
.fcg small{font-weight:400;font-size:12px;opacity:.85}
.gr1{border-color:#d9534f!important;color:var(--ar)}.gr2{border-color:#e0a030!important;color:var(--ay)}.gr3{border-color:#249b70!important;color:#249b70}
.hist p{margin:4px 0;font-size:13px}
/* 2.9: resposta e comentário no final do simulado */
.fb-head{margin-bottom:10px;font-size:14px}.fb-head span{opacity:.9}
.fb-gab{padding:10px 12px;border-radius:10px;background:rgba(36,155,112,.16);margin-bottom:10px}
.fb-gab small{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;opacity:.8;text-transform:uppercase}
.fb-gab div{font-size:15px;font-weight:600;margin-top:2px}
.fb-sec{margin-top:12px}.fb-sec>b{display:block;font-size:11px;letter-spacing:.5px;text-transform:uppercase;opacity:.8;margin-bottom:5px}
.fb-sec p{margin:0;line-height:1.6;font-size:14px}
.fb-alts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.fb-alts li{padding:8px 10px;border-radius:9px;border:1px solid var(--line);font-size:13px;line-height:1.5}
.fb-alts li.alt-ok{border-color:#249b70;background:rgba(36,155,112,.14)}.fb-alts li.alt-mine{border-width:2px}
.fb-res{margin-top:8px;padding:12px;border-radius:12px;border:1px solid var(--line)}
/* 3.0: banco do Gran */
.fi{width:100%;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:8px 0 6px;font:inherit}
/* 2.8: menu hambúrguer */
#burger{font-size:20px;line-height:1;padding:6px 10px}
.drawer[hidden]{display:none}
.drawer{position:fixed;inset:0;z-index:60}
.scrim{position:absolute;inset:0;background:rgba(10,15,30,.5)}
.dmenu{position:absolute;top:0;left:0;bottom:0;width:min(80vw,290px);background:var(--card);border-right:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px;box-shadow:0 0 30px rgba(0,0,0,.35);animation:dmIn .2s ease-out;overflow-y:auto}
@keyframes dmIn{from{transform:translateX(-100%)}to{transform:none}}
.dm-head{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 12px;border-bottom:1px solid var(--line);margin-bottom:8px;font-size:17px}
.dmenu button{text-align:left;border:0;background:transparent;color:var(--ink);padding:14px 12px;border-radius:10px;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.dmenu button:hover,.dmenu button:focus-visible{background:rgba(82,109,229,.12)}
.dmenu button.on{background:rgba(82,109,229,.2);color:var(--blue)}
/* 2.6: cores por aproveitamento, abas, linha do tempo, horas e pontos fracos */
:root{--ar:#c9302c;--ay:#9a6200}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ar:#ff7b7b;--ay:#f2c14e}}
:root[data-theme="dark"]{--ar:#ff7b7b;--ay:#f2c14e}
.acc-r{color:var(--ar)}.acc-y{color:var(--ay)}
tr.acc-r,tr.acc-r *{color:var(--ar)!important}tr.acc-y,tr.acc-y *{color:var(--ay)!important}
.seg.tabs{margin:12px 0 4px}.seg.tabs button{padding:10px 4px;font-size:13px}
.mbar{height:8px;border-radius:6px;background:rgba(147,160,189,.25);overflow:hidden;margin:3px 0 4px}.mbar i{display:block;height:100%;background:#526de5}
.hr{margin:12px 0}.hrt{display:flex;justify-content:space-between;gap:10px;font-size:14px}.hrt b{white-space:nowrap}.hrt span{min-width:0}.hrt small{color:var(--mut)}.hr small{color:var(--mut);font-size:12px}
.tl{list-style:none;margin:12px 0 10px;padding:0 0 0 16px;border-left:2px solid var(--line)}
.tld{position:relative;margin-bottom:16px}.tld::before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:#526de5;border:2px solid var(--card)}
.tlh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px}.tlh span{color:var(--mut);font-size:12px}
.tld ul{list-style:none;margin:6px 0 0;padding:0}.tld ul li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:13px;border-bottom:1px dashed var(--line)}.tld ul small{color:var(--mut);white-space:nowrap;font-size:11px}
.nw{font-style:normal;font-size:10px;font-weight:700;color:#249b70;background:rgba(36,155,112,.18);border-radius:8px;padding:1px 6px;margin-left:3px}
.wk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.wkm{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;font-size:14px}.wkm small{color:var(--mut);font-size:12px}.wkp{font-size:18px;font-weight:700}
.wk.acc-r .wkp,.wk.acc-r b{color:var(--ar)}.wk.acc-y .wkp,.wk.acc-y b{color:var(--ay)}
@media (max-width:480px){header .nm{display:none}header{gap:6px;flex-wrap:nowrap}.pomo{padding:3px 6px;gap:5px;flex:1;justify-content:space-between}#ps{order:3}}
.seg.wrap{flex-wrap:wrap;gap:6px;border:0;overflow:visible}.seg.wrap button{flex:1 1 46%;padding:9px 6px;border:1px solid var(--line);border-radius:10px}.seg.wrap button+button{border-left:1px solid var(--line)}.seg.wrap .on{border-color:var(--blue)}
.bd{display:inline-block;font-size:10px;font-weight:700;border-radius:10px;padding:2px 8px;margin:0 5px 4px 0}
.bd.r{background:rgba(217,83,79,.18);color:#d9534f}.bd.ok{background:rgba(82,109,229,.18);color:#6f86f0}.bd.g{background:rgba(36,155,112,.2);color:#249b70}.bd.n{background:rgba(147,160,189,.22);color:var(--mut)}
button.pri:disabled{opacity:.45}
button.opt{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.opt.x span{text-decoration:line-through;opacity:.45}.opt.x b{opacity:.45}
.hint{font-size:11px;color:var(--mut);margin:6px 0 0}
.ghost.gr{background:#249b70;border-color:#249b70;color:#fff;font-weight:650}
button.tp{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:10px;margin:5px 0;border-radius:10px;border:1px solid var(--line);border-left:6px solid var(--mut);background:var(--card)}
.tp.g{border-left-color:#249b70;background:rgba(36,155,112,.14)}.tp.y{border-left-color:#e0a030;background:rgba(224,160,48,.16)}.tp.r{border-left-color:#d9534f;background:rgba(217,83,79,.12)}
.tp .tn{flex:1}.tp b{font-size:12px}
.dh{display:block;margin:12px 0 2px;color:var(--mut);font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.5px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.dot.g{background:#249b70}.dot.y{background:#e0a030}.dot.r{background:#d9534f}
.leg3{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin:8px 0}
.bar2{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:3px 0 8px}.bar2 .g{background:#249b70}.bar2 .r{background:#d9534f}


#toast{position:fixed;left:12px;right:12px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px;border-radius:10px;display:none;z-index:9}
</style></head><body>
<header><button id="burger" class="sm" aria-label="Abrir menu" aria-expanded="false" onclick="openMenu()">☰</button><h1>📚<span class="nm"> StudyQuest</span></h1><div class="pomo" id="pomo"><span>🍅</span><b id="pt">25:00</b><small id="pp">Foco</small><button class="sm" id="pg" onclick="pToggle()">▶</button><button class="sm" onclick="pReset()">↺</button><button class="sm" onclick="togg('ps')">⚙</button></div>
<div id="ps"><label>Foco<input type="number" id="cf" min="1"></label><label>Intervalo<input type="number" id="cb" min="1"></label><label>Longo<input type="number" id="cl" min="1"></label><label>A cada<input type="number" id="ce" min="2"></label><label><input type="checkbox" id="cs"> Bip</label><label><input type="checkbox" id="ca"> Iniciar com as questões</label><button class="sm" onclick="beep(1);setTimeout(()=>beep(2),800)">Testar</button></div></header>
<main id="v"></main><div id="toast"></div>
<div id="drawer" class="drawer" hidden>
<div class="scrim" onclick="closeMenu()"></div>
<nav class="dmenu" aria-label="Menu principal">
<div class="dm-head"><b>📚 StudyQuest</b><button class="sm" onclick="closeMenu()" aria-label="Fechar menu">✕</button></div>
<button data-v="dash" onclick="goAce('dash')">▦ Painel</button>
<button data-v="study" onclick="goAce('study')">◎ Estudar</button>
<button data-v="sim" onclick="goAce('sim')">▤ Simulado</button>
<button data-v="rev" onclick="goAce('rev')">↻ Revisar</button>
<button onclick="goGran()">📘 Questões do Gran</button>
<button onclick="closeMenu();setCtx('ace');fcView()">🃏 Flashcards</button>
<button onclick="theme();closeMenu()">🌓 Modo escuro / claro</button>
</nav></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let bank=[],byId=new Map();const LET=['A','B','C','D','E'];
const setBank=b=>{bank=b;byId=new Map(b.map(q=>[q.i,q]))};
const kv=window.__kv||{db:null,open(){return this.db||(this.db=new Promise((ok,no)=>{const r=indexedDB.open('sq',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}))},get(k){return this.open().then(d=>new Promise((ok,no)=>{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}))},set(k,v){return this.open().then(d=>new Promise((ok,no)=>{const x=d.transaction('k','readwrite');x.objectStore('k').put(v,k);x.oncomplete=()=>ok();x.onerror=()=>no(x.error)}))}};
const KEY='sq-mobile-v1';let S={ans:[],marks:[],cfg:{f:25,b:5,l:15,e:4,s:1,a:1},day:{d:'',fd:0,cy:0,fs:0},run:null,theme:'',exam:{name:'ACE - Floresta',banca:'FACET',date:'2026-11-22'}};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const dk=()=>new Date().toDateString();S.cfg=Object.assign({a:1},S.cfg);S.exam=Object.assign({name:'ACE - Floresta',banca:'FACET',date:'2026-11-22'},S.exam);if(S.day.d!==dk())S.day={d:dk(),fd:0,cy:0,fs:0};
const applyTheme=()=>{if(S.theme&&document.documentElement)document.documentElement.dataset.theme=S.theme};
function theme(){const dk=S.theme?S.theme==='dark':window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches;S.theme=dk?'light':'dark';applyTheme();save()}
applyTheme();
const isT=iso=>new Date(iso).toDateString()===dk();
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)};
const togg=id=>{const e=$('#'+id);e.style.display=e.style.display==='flex'?'none':'flex'};
const V=h=>{$('#v').innerHTML=h;scrollTo(0,0)};
const F={study:'todas',sim:'todas'};
const pool=(k,t,f)=>{const d=new Set(S.ans.map(a=>a.q));return bank.filter(q=>(k==='Todas'||q.k===k)&&(!t||q.t===t)&&(f==='todas'||(f==='sim')===d.has(q.i)))};
const seg=sc=>`<div class="seg">${[['todas','Todas'],['nao','Não respondidas'],['sim','Respondidas']].map(([v,l])=>`<button class="${F[sc]===v?'on':''}" onclick="F.${sc}='${v}';go('${sc}')">${l}</button>`).join('')}</div>`;
const PAL=['#526de5','#249b70','#e0803a','#a35bd6','#d9534f','#2aa6c9'];
function donut(sg,c,sub){const t=sg.reduce((a,x)=>a+x.v,0),C=2*Math.PI*52;let o=0;
 const r=t?sg.filter(x=>x.v>0).map(x=>{const l=x.v/t*C,e=`<circle cx="70" cy="70" r="52" fill="none" stroke="${x.c}" stroke-width="22" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}" transform="rotate(-90 70 70)"/>`;o+=l;return e}).join(''):'<circle cx="70" cy="70" r="52" fill="none" stroke="#9aa5bd44" stroke-width="22"/>';
 return `<div class="don"><svg viewBox="0 0 140 140"><text x="70" y="72" text-anchor="middle" font-size="22" font-weight="800" fill="currentColor">${c}</text><text x="70" y="88" text-anchor="middle" font-size="9" fill="#93a0bd">${sub}</text>${r}</svg><div class="lg">${sg.map(x=>`<div><i style="background:${x.c}"></i><span>${E(x.l)}</span><b>${x.v}${t?' · '+Math.round(x.v/t*100)+'%':''}</b></div>`).join('')}</div></div>`}
function openMenu(){$('#drawer').hidden=false;$('#burger').setAttribute('aria-expanded','true')}
function closeMenu(){const d=$('#drawer');if(d)d.hidden=true;const b=$('#burger');if(b)b.setAttribute('aria-expanded','false')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
function go(v){closeMenu();document.querySelectorAll('.dmenu button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));({dash,study:()=>cfgView('study'),sim:()=>cfgView('sim'),rev})[v]()}
const fmt=ms=>{const m=Math.round(ms/60000);return m<60?m+' min':Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min'};
const grp=(f,l=S.ans)=>{const m=new Map();l.forEach(a=>{const q=byId.get(a.q);if(!q)return;const k=f(q),o=m.get(k)||{n:0,ok:0,k};o.n++;if(a.ok)o.ok++;m.set(k,o)});return[...m.values()]};
const tstat=()=>{const d=new Set(S.ans.map(a=>a.q)),m=new Map();bank.forEach(q=>{const k=q.d+'|'+q.t,o=m.get(k)||{k,d:q.d,t:q.t,kd:q.k,n:0,a:0};o.n++;if(d.has(q.i))o.a++;m.set(k,o)});return[...m.values()].map(o=>({...o,st:o.a===0?'r':o.a>=o.n?'g':'y'}))};
let RM='d';
const dayKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseDay=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const discC=n=>PAL[Math.max(0,[...new Set(bank.map(q=>q.d))].indexOf(n))%PAL.length];
const swc=c=>`<i class="sw" style="background:${c}"></i>`;
// Dias do primeiro estudo até a prova: g=estudou, r=não estudou, y=hoje, f=dia futuro, x=dia da prova
function consistency(ans,exam,now=new Date()){
 const today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),per=new Map();
 ans.forEach(a=>{const k=dayKey(new Date(a.t));per.set(k,(per.get(k)||0)+1)});
 const keys=[...per.keys()].sort(),first=keys.length?parseDay(keys[0]):today,start=first<today?first:today;
 const ex=exam&&exam.date?parseDay(exam.date):null,end=ex&&ex>=start?ex:today,days=[];
 for(let d=new Date(start);d<=end;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)){
  const k=dayKey(d),n=per.get(k)||0;let st;
  if(ex&&k===dayKey(ex))st='x';else if(d>today)st='f';else if(k===dayKey(today))st='y';else st=n?'g':'r';
  days.push({k,st,n,date:new Date(d)})}
 const past=days.filter(d=>d.date<=today);let best=0,run=0,cur=0;
 past.forEach(d=>{if(d.n){run++;best=Math.max(best,run)}else if(d.k!==dayKey(today))run=0});
 let i=past.length-1;if(i>=0&&!past[i].n&&past[i].k===dayKey(today))i--;
 for(;i>=0&&past[i].n;i--)cur++;
 return{days,cur,best,studied:past.filter(d=>d.n).length,elapsed:past.length,remaining:ex?Math.round((ex-today)/86400000):null}}
function consistCards(){
 const ex=S.exam,c=consistency(S.ans,ex),rem=c.remaining,lb={g:'estudou',r:'não estudou',y:'hoje',f:'ainda não chegou',x:'dia da prova'};
 const cls=rem===null?'none':rem<0?'past':rem===0?'today':rem<=3?'warn':'ok',
 tx=rem===null?'Defina a data da prova':rem<0?`Prova realizada há ${-rem} dia(s)`:rem===0?'A prova é hoje!':rem===1?'Falta 1 dia':`${rem} dias restantes`;
 return `<div class="card"><b>Constância nos estudos</b><p class="mut">Cada quadrado é um dia, do primeiro dia de estudo até a prova. Toque para ver a data.</p>
 <div class="dg">${c.days.map(d=>{const t=d.date.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'})+' — '+lb[d.st]+(d.n?' · '+d.n+' questão(ões)':'');return `<span class="day d-${d.st}" title="${E(t)}" onclick="toast(this.title)"></span>`}).join('')}</div>
 <div class="dl"><span><i class="day d-g"></i>Estudou</span><span><i class="day d-r"></i>Não estudou</span><span><i class="day d-y"></i>Hoje</span><span><i class="day d-f"></i>Futuros</span><span><i class="day d-x"></i>Prova</span></div>
 <p class="mut">Você está há ${c.cur} dia(s) sem falhar. Seu recorde é de ${c.best} dia(s). Dias estudados: ${c.studied} de ${c.elapsed}.</p></div>
 <div class="card exm"><b>Data da prova</b><div class="ex-name">${E(ex.name||'Minha prova')}</div>${ex.date?`<div>${parseDay(ex.date).toLocaleDateString('pt-BR')}</div>`:''}${ex.banca?`<div class="mut">Banca: ${E(ex.banca)}</div>`:''}<div class="ex-count ${cls}">${E(tx)}</div>
 <details><summary class="mut">Editar prova</summary><div class="exf"><label>Nome da prova<input class="fi" id="en" value="${E(ex.name||'')}" placeholder="Ex.: ACE - Floresta"></label><label>Banca<input class="fi" id="eb" value="${E(ex.banca||'')}" placeholder="Ex.: FACET"></label><label>Data da prova<input class="fi" id="ed" type="date" value="${E(ex.date||'')}"></label><button class="pri" style="width:100%" onclick="saveExam()">Salvar</button></div></details></div>`}
function saveExam(){S.exam={name:$('#en').value.trim(),banca:$('#eb').value.trim(),date:$('#ed').value};save();dash();toast('Prova atualizada')}
// ===== Núcleo de flashcards (mesmo código no desktop e no celular) =====
// Depende apenas de dayKey(d) e parseDay('AAAA-MM-DD'), que já existem nos dois apps.
const FC_SEQ=[1,7,15,30];
const FC_MOTIVOS={atencao:{t:'Falta de atenção',i:'👁️',dica:'Treine a leitura cuidadosa do comando e das alternativas.'},esqueci:{t:'Esqueci',i:'🧠',dica:'Reforce com flashcards e revisões espaçadas.'},nao_sabia:{t:'Não sabia',i:'❓',dica:'Volte à teoria, aos exemplos ou à videoaula antes de tentar de novo.'}};
const FC_CONF={certeza:{t:'Certeza',i:'✔'},duvida:{t:'Dúvida',i:'◐'},chute:{t:'Chute',i:'🎲'}};
const FC_RES={errei:{t:'Errei',i:'✘'},dificil:{t:'Lembrei com dificuldade',i:'◐'},facil:{t:'Acertei com facilidade',i:'✔'}};
const FC_ORIGEM={errada:'✘ Errada',certa:'✔ Certa marcada',marcada:'★ Marcada'};
const fcToday=(now=new Date())=>new Date(now.getFullYear(),now.getMonth(),now.getDate());
const fcAdd=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const fcDaysTo=(a,b)=>Math.round((b-a)/86400000);
// Dias até a próxima revisão. Com data de prova, a sequência é comprimida (fator = dias restantes / 53)
// e a última revisão cai, no máximo, na véspera da prova.
function fcInterval(base,today,examISO){
  const left=examISO?fcDaysTo(today,parseDay(examISO)):null;
  if(left===null||left<=0)return base;
  const n=Math.max(1,Math.round(base*Math.min(1,left/53)));
  return Math.max(0,Math.min(n,left-1));
}
// Resultado de uma revisão: errei = volta ao 1º intervalo · difícil = 3 dias · fácil = próximo da sequência (1, 7, 15, 30)
function fcSchedule(card,result,today,examISO){
  let step=card.step||0,days;
  if(result==='errei'){step=0;days=fcInterval(FC_SEQ[0],today,examISO);}
  else if(result==='dificil'){days=fcInterval(3,today,examISO);}
  else{step+=1;if(step>=FC_SEQ.length)return{step,state:'dominado',due:null,days:null};days=fcInterval(FC_SEQ[step],today,examISO);}
  return{step,state:'ativo',due:dayKey(fcAdd(today,days)),days};
}
function fcActivate(card,now,examISO){
  const t=fcToday(now);
  return{...card,state:'ativo',step:0,due:dayKey(fcAdd(t,fcInterval(FC_SEQ[0],t,examISO))),updated:now.toISOString()};
}
function fcReopen(card,now){return{...card,state:'ativo',step:0,due:dayKey(fcToday(now)),updated:now.toISOString()};}
function fcApplyReview(card,result,now,examISO){
  const s=fcSchedule(card,result,fcToday(now),examISO);
  const nc={...card,step:s.step,state:s.state,due:s.due,lastDays:s.days,reviews:(card.reviews||0)+1,lapses:(card.lapses||0)+(result==='errei'?1:0),last:now.toISOString(),updated:now.toISOString()};
  return{card:nc,log:{fc:card.id,at:now.toISOString(),result,prev:card.lastDays??null,next:s.days,due:s.due}};
}
// Rascunho a partir da questão (q = {id,s,o,a,e,d,t,k}); nunca inventa explicação.
function fcDraft(q,att,now=new Date()){
  const alt=q.a&&q.o&&q.o[q.a]!==undefined?`${q.a}) ${q.o[q.a]}`:(q.a||'—'),pend=!(q.e&&String(q.e).trim());
  return{id:'fc:'+q.id,q:q.id,front:q.s,back:`Gabarito: ${alt}\n\n${pend?'(Explicação pendente: escreva aqui a regra ou o macete.)':q.e}`,d:q.d||'',t:q.t||'',k:q.k||'',
    origin:att?(att.ok?'certa':'errada'):'marcada',reason:(att&&att.reason)||null,pending:pend,state:'rascunho',step:0,due:null,created:now.toISOString(),updated:now.toISOString(),reviews:0,lapses:0};
}
const fcIsDue=(c,tk)=>c.state==='ativo'&&!!c.due&&c.due<=tk;
function fcDueList(cards,now=new Date()){const tk=dayKey(fcToday(now));return cards.filter(c=>fcIsDue(c,tk)).sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0);}
function fcCounts(cards,now=new Date()){
  const tk=dayKey(fcToday(now)),c={hoje:0,atrasados:0,todos:cards.length,erradas:0,certas:0,rascunhos:0,dominados:0,ativos:0};
  cards.forEach(x=>{if(x.state==='rascunho')c.rascunhos++;else if(x.state==='dominado')c.dominados++;else{c.ativos++;if(x.due===tk)c.hoje++;else if(x.due&&x.due<tk)c.atrasados++;}
    if(x.origin==='errada')c.erradas++;if(x.origin==='certa')c.certas++;});
  return c;
}
function fcDueText(c,now=new Date()){
  if(c.state==='rascunho')return'rascunho (ainda sem agenda)';if(c.state==='dominado')return'dominado';
  const t=fcToday(now),d=parseDay(c.due),n=fcDaysTo(t,d),dm=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
  return n<0?`atrasado ${-n} dia(s) (${dm})`:n===0?'vence hoje':n===1?`amanhã (${dm})`:`em ${n} dias (${dm})`;
}
function fcMotivosCount(atts){const m={atencao:0,esqueci:0,nao_sabia:0};atts.forEach(a=>{if(a.reason&&m[a.reason]!==undefined)m[a.reason]++;});return m;}
// Mescla duas listas de cartões pelo id; vence a alteração mais recente (para a sincronização por arquivo)
function fcMerge(a,b){const m=new Map(a.map(c=>[c.id,c]));b.forEach(c=>{const o=m.get(c.id);if(!o||(c.updated||'')>(o.updated||''))m.set(c.id,c);});return[...m.values()];}
function fcMergeLogs(a,b){const k=r=>r.fc+'|'+r.at,m=new Map(a.map(r=>[k(r),r]));b.forEach(r=>{if(!m.has(k(r)))m.set(k(r),r);});return[...m.values()].sort((x,y)=>x.at<y.at?-1:1);}


// ===== Flashcards no celular (2.7) — mesmo núcleo do desktop =====
let CARDS=[],FCR=[],FCS=null;
let GBANK=[],CTX='ace',ACE_SAVE=null;
// Troca o banco ativo: 'gran' usa GBANK; 'ace' volta ao banco do ACE. Painel, estudo e revisão leem o banco ativo.
function setCtx(c){
 if(c===CTX)return;
 if(c==='gran'){ACE_SAVE={bank,byId};bank=GBANK;byId=new Map(GBANK.map(q=>[q.i,q]));CTX='gran'}
 else{if(ACE_SAVE){bank=ACE_SAVE.bank;byId=ACE_SAVE.byId;ACE_SAVE=null}CTX='ace'}
}
const goAce=v=>{setCtx('ace');go(v)};
const granGo=v=>{setCtx('gran');go(v)};
function goGran(){closeMenu();setCtx('gran');V(granCardHTML());bindGranFile()}
function bindGranFile(){const gf=$('#gf');if(gf)gf.onchange=e=>granLoad(e.target.files[0])}
function granCardHTML(){
 const n=GBANK.length,pend=GBANK.filter(q=>q.avisos&&q.avisos.length).length;
 if(!n)return importCardGran();
 return `<div class="card"><b>📘 Questões do Gran</b><p class="mut">${n} questões neste aparelho${pend?` · ${pend} para conferir`:''}. Estatísticas separadas das do ACE.</p>
 <button class="pri" style="width:100%" onclick="granGo('study')">Estudar por assunto</button>
 <button class="ghost" style="width:100%;margin-top:8px" onclick="granGo('sim')">Simulado completo</button>
 <button class="ghost" style="width:100%;margin-top:8px" onclick="granGo('rev')">Revisar erros do Gran</button>
 <button class="ghost" style="width:100%;margin-top:8px" onclick="granGo('dash')">Painel do Gran</button>
 <button class="ghost" style="width:100%;margin-top:8px" onclick="granReplaceCard()">Trocar banco do Gran</button></div>`;
}
function importCardGran(){return `<div class="card"><b>📘 Questões do Gran</b><p class="mut">Ainda não há banco do Gran neste aparelho. Gere o <b>questoes-gran.json</b> no computador com o importador e escolha o arquivo aqui. Ele fica guardado só neste celular, separado do ACE.</p><input type="file" id="gf" class="fi" accept=".json,application/json"><p id="gm" class="mut"></p></div>`}
function granReplaceCard(){V(importCardGran());bindGranFile()}
async function granLoad(f){
 const m=$('#gm');
 try{
  const d=JSON.parse(await f.text()),arr=Array.isArray(d)?d:(d.questoes||[]);
  const ok=arr.filter(q=>q&&q.id&&q.s&&q.o&&Object.keys(q.o).length>=2);
  if(!ok.length)throw 0;
  GBANK=ok.map(q=>({i:String(q.id),k:'Gran',d:q.d||'Sem disciplina',t:q.t||q.d||'Sem assunto',n:null,s:q.s,o:q.o,a:q.a||'',e:q.e||'',avisos:Array.isArray(q.avisos)?q.avisos:[]}));
  if(CTX==='gran'){byId=new Map(GBANK.map(q=>[q.i,q]));bank=GBANK}
  await kv.set('granBank',GBANK);toast(GBANK.length+' questões do Gran carregadas');
  V(granCardHTML());bindGranFile();
 }catch(e){if(m)m.textContent='Arquivo inválido. Use o questoes-gran.json gerado pelo importador.'}
}

const saveCards=()=>{kv.set('cards',CARDS).catch(()=>{})};
const saveFcr=()=>{kv.set('fcrev',FCR).catch(()=>{})};
const cardOfQ=id=>CARDS.find(c=>c.q===id);
const cardById=id=>CARDS.find(c=>c.id===id);
const examISO=()=>(S.exam&&S.exam.date)||null;
const lastAttM=id=>{let b=null;S.ans.forEach(a=>{if(a.q===id&&(!b||a.t>=b.t))b=a});return b};
// rascunho criado por questão (nunca duplica); retorna true se criou
function ensureDraftM(q){
 if(cardOfQ(q.i))return false;
 const a=lastAttM(q.i);
 CARDS.push(fcDraft({id:q.i,s:q.s,o:q.o,a:q.a,e:q.e,d:q.d,t:q.t,k:q.k},a?{ok:a.ok,reason:a.r}:null));
 saveCards();return true;
}
// ao responder: origem do cartão ainda rascunho passa a "certa" ou "errada"
function cardOrigin(q,ok){const c=cardOfQ(q.i);if(c&&c.state==='rascunho'&&c.origin==='marcada'){c.origin=ok?'certa':'errada';c.updated=new Date().toISOString();saveCards()}}
// painel "Por que errei?" / "Como foi?" abaixo do feedback
function metaH(q){
 const a=lastAttM(q.i);if(!a)return '';
 const chips=a.ok
  ?Object.entries(FC_CONF).map(([k,v])=>`<button class="ch ${a.c===k?'on':''}" onclick="setAttM('${q.i}','c','${k}')">${v.i} ${v.t}</button>`).join('')
  :Object.entries(FC_MOTIVOS).map(([k,v])=>`<button class="ch ${a.r===k?'on':''}" onclick="setAttM('${q.i}','r','${k}')">${v.i} ${v.t}</button>`).join('');
 const c=cardOfQ(q.i);
 const line=!c?`<button class="sm" onclick="mkDraft('${q.i}')">🃏 Criar rascunho</button>`
  :c.state==='rascunho'?`<span class="tag">📝 Rascunho</span> <button class="sm" onclick="openCard('${q.i}')">Conferir e ativar</button>`
  :c.state==='dominado'?`<span class="tag ok-tag">🏆 Dominado</span>`
  :`<span class="tag ok-tag">🃏 ${E(fcDueText(c))}</span>`;
 return `<div id="fcm" class="fcm"><div class="fcr"><b>${a.ok?'Como foi?':'Por que errei?'}</b><div class="chs">${chips}</div></div><div class="fcr"><b>Flashcard</b><div>${line}</div></div></div>`;
}
function setAttM(qi,f,v){
 const a=lastAttM(qi);if(!a)return;
 a[f]=a[f]===v?null:v;save();
 const c=cardOfQ(qi);
 if(c&&f==='r'&&!a.ok&&c.origin==='errada'){c.reason=a.r;c.updated=new Date().toISOString();saveCards()}
 const q=byId.get(qi);const fm=$('#fcm');if(fm&&q)fm.outerHTML=metaH(q);
}
function mkDraft(qi){const q=byId.get(qi);if(q&&ensureDraftM(q))toast('Rascunho criado. Confira na aba Flashcards.');const fm=$('#fcm');if(fm&&q)fm.outerHTML=metaH(q)}
// ----- tela de flashcards (dentro de Revisar) -----
const FCF_LB=[['agora','Revisar agora'],['todos','Todos'],['erradas','✘ Erradas'],['certas','✔ Certas'],['rascunhos','📝 Rascunhos'],['dominados','🏆 Dominados']];
window.FCF=window.FCF||'agora';
function fcFilt(F){
 const all=CARDS;let l;
 if(F==='agora')return fcDueList(all);
 if(F==='erradas')l=all.filter(c=>c.origin==='errada'&&c.state!=='rascunho');
 else if(F==='certas')l=all.filter(c=>c.origin==='certa'&&c.state!=='rascunho');
 else if(F==='rascunhos')l=all.filter(c=>c.state==='rascunho');
 else if(F==='dominados')l=all.filter(c=>c.state==='dominado');
 else l=all.slice();
 return l.sort((a,b)=>(a.due||'9')<(b.due||'9')?-1:1);
}
function fcView(){
 const k=fcCounts(CARDS),due=fcDueList(CARDS).length,F=window.FCF,lw=lastWrong(),wrong=bank.filter(q=>lw.has(q.i)&&!cardOfQ(q.i)).length,shown=fcFilt(F).slice(0,30);
 V(`<div class="card"><button class="ghost" onclick="go('rev')">← Revisar</button><b>🃏 Flashcards</b><p class="mut">Questões marcadas e erradas viram cartões. Quando você erra, o cartão volta no dia certo.</p>
 <div class="grid"><div class="card"><b>${due}</b><small>para revisar agora</small></div><div class="card"><b>${k.hoje}</b><small>vencem hoje</small></div><div class="card"><b class="${k.atrasados?'acc-r':''}">${k.atrasados}</b><small>atrasados</small></div><div class="card"><b>${k.rascunhos}</b><small>rascunhos</small></div></div>
 <button class="pri" style="width:100%" ${due?'':'disabled'} onclick="fcStart()">Revisar agora (${due})</button>
 <button class="ghost" style="width:100%;margin-top:8px" ${wrong?'':'disabled'} onclick="fcBulk()">Criar rascunhos das erradas (${wrong})</button></div>
 <div class="seg wrap">${FCF_LB.map(([f,l])=>`<button class="${F===f?'on':''}" onclick="window.FCF='${f}';fcView()">${l}</button>`).join('')}</div>
 ${shown.map(c=>`<div class="card"><span class="tag">${E(c.d)} · ${E(c.t)}</span><p class="st">${E(c.front.slice(0,160))}${c.front.length>160?'…':''}</p><p class="mut">${E(FC_ORIGEM[c.origin]||'')}${c.reason?' · '+E(FC_MOTIVOS[c.reason].t):''} · ${E(fcDueText(c))}</p><button class="sm" onclick="openCard('${c.q}')">${c.state==='rascunho'?'Conferir e ativar':'Editar'}</button></div>`).join('')||'<div class="card"><p class="mut">Nenhum cartão neste filtro.</p></div>'}`);
}
function fcBulk(){const lw=lastWrong(),l=bank.filter(q=>lw.has(q.i)&&!cardOfQ(q.i));l.forEach(ensureDraftM);toast(l.length+' rascunho(s) criado(s)');window.FCF='rascunhos';fcView()}
function openCard(qi){
 const q=byId.get(qi);if(!q)return;ensureDraftM(q);const c=cardOfQ(qi),hist=FCR.filter(r=>r.fc===c.id);
 V(`<div class="card"><button class="ghost" onclick="fcView()">← Voltar</button><b>${c.state==='rascunho'?'Rascunho de flashcard':'Flashcard'}</b>
 <p class="mut">${E(c.d)} · ${E(c.t)}<br>Gabarito vinculado à questão: <b>${E(q.a)}</b> · ${E(FC_ORIGEM[c.origin]||'')}${c.pending?' · <span class="acc-y">explicação pendente</span>':''}</p>
 <label class="fl">Frente (pergunta)<textarea id="ff" class="fi" rows="4">${E(c.front)}</textarea></label>
 <label class="fl">Verso (resposta e explicação)<textarea id="fbk" class="fi" rows="6">${E(c.back)}</textarea></label>
 <div class="row" style="flex-wrap:wrap"><button class="ghost" onclick="saveEdit('${qi}',false)">Salvar</button>${c.state==='rascunho'?`<button class="pri" onclick="saveEdit('${qi}',true)">Salvar e ativar</button>`:''}${c.state==='dominado'?`<button class="ghost" onclick="reopenCard('${qi}')">Voltar à revisão</button>`:''}</div>
 <button class="ghost" style="width:100%;margin-top:10px" onclick="delCard('${qi}')">Excluir cartão</button>
 ${hist.length?`<div class="hist"><b>Histórico</b>${hist.slice().reverse().map(r=>`<p class="mut">${E(new Date(r.at).toLocaleDateString('pt-BR'))} · ${E(FC_RES[r.result].i+' '+FC_RES[r.result].t)}${r.next!=null?' · próxima em '+r.next+' dia(s)':' · dominado'}</p>`).join('')}</div>`:''}</div>`);
}
function saveEdit(qi,activate){
 const c=cardOfQ(qi),front=$('#ff').value.trim();if(!front){toast('A frente não pode ficar vazia.');return}
 let n={...c,front,back:$('#fbk').value,pending:$('#fbk').value.includes('(Explicação pendente'),updated:new Date().toISOString()};
 if(activate)n=fcActivate(n,new Date(),examISO());
 CARDS[CARDS.indexOf(c)]=n;saveCards();toast(activate?'Ativado. Primeira revisão: '+fcDueText(n):'Salvo');fcView();
}
function reopenCard(qi){const c=cardOfQ(qi),n=fcReopen(c,new Date());CARDS[CARDS.indexOf(c)]=n;saveCards();toast('De volta à revisão');fcView()}
function delCard(qi){const c=cardOfQ(qi);if(!c||!confirm('Excluir este flashcard e o histórico dele? A questão continua no banco.'))return;CARDS=CARDS.filter(x=>x!==c);FCR=FCR.filter(r=>r.fc!==c.id);saveCards();saveFcr();fcView()}
// ----- sessão de revisão: pergunta, depois verso e 3 opções -----
function fcStart(){const l=fcDueList(CARDS);if(!l.length){toast('Nenhum cartão para revisar agora');return}FCS={list:l.map(c=>c.id),i:0,show:false,res:{errei:0,dificil:0,facil:0}};renderFcS()}
function renderFcS(){
 while(FCS.i<FCS.list.length&&!cardById(FCS.list[FCS.i]))FCS.i++;

let lastTap={l:'',q:'',t:0,p:null};
const paintOpts=()=>{const q=cur(),sk=run.strike[q.i]||{};document.querySelectorAll('.opt').forEach(b=>{const l=b.id.slice(1);b.classList.toggle('sel',run.sel[q.i]===l);b.classList.toggle('x',!!sk[l])})};
// 1 toque seleciona (depois é só tocar em Responder); 2 toques seguidos riscam (ou desriscam) a alternativa
function tapOpt(l){const q=cur();if(run.done[q.i])return;const now=Date.now(),sk=run.strike[q.i]||(run.strike[q.i]={}),dbl=lastTap.l===l&&lastTap.q===q.i&&now-lastTap.t<350;
 if(dbl){const p=lastTap.p;if(p.sel===undefined)delete run.sel[q.i];else run.sel[q.i]=p.sel;
  if(p.struck)delete sk[l];else{sk[l]=1;if(run.sel[q.i]===l)delete run.sel[q.i]}
  lastTap={l:'',q:'',t:0,p:null}}
 else{lastTap={l,q:q.i,t:now,p:{sel:run.sel[q.i],struck:!!sk[l]}};delete sk[l];run.sel[q.i]=l}
 paintOpts();rsave()}
function choose(l){const q=cur();if(run.done[q.i])return;run.sel[q.i]=l;document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',b.id==='o'+l));rsave()}
function mark(b){const q=cur(),i=S.marks.indexOf(q.i);i<0?S.marks.push(q.i):S.marks.splice(i,1);save();b.textContent=i<0?'★ Marcada':'☆ Marcar';b.classList.toggle('gr',i<0);if(i<0&&ensureDraftM(q))toast('Rascunho de flashcard criado');const fm=$('#fcm');if(fm)fm.outerHTML=metaH(q)}
function rec(q){const ok=run.sel[q.i]===q.a;cardOrigin(q,ok);S.ans.push({q:q.i,a:run.sel[q.i],ok,t:new Date().toISOString(),ms:run.ms[q.i]||0,m:run.mode});run.done[q.i]=true;
 if(run.mode==='rev'&&ok){const i=S.marks.indexOf(q.i);if(i>=0)S.marks.splice(i,1)}   // revisou e acertou: sai da lista de revisão
 save()}
function submit(){const q=cur();if(!run.sel[q.i])return toast('Escolha uma alternativa');acc();rec(q);rsave();rq()}
function mv(d){acc();run.i=Math.max(0,Math.min(run.l.length-1,run.i+d));rsave();rq()}
function explParts(exp){const clean=s=>String(s||'').replace(/([^\s-])-\s+(?=[a-zà-ú])/g,'$1');const parts=clean(exp).split(/\n(?=\([A-E]\) )/);const comment=(parts[0]||'').trim();const alts=parts.slice(1).map(p=>{const m=p.match(/^\(([A-E])\)\s*([\s\S]*)$/);return m?{k:m[1],t:m[2].trim()}:null}).filter(Boolean);return{comment,alts}}
function explM(q,chosen){const {comment,alts}=explParts(q.e);const gab=q.o&&q.o[q.a]!==undefined?`${q.a}) ${q.o[q.a]}`:'';return `<div class="fb-head"><span>Sua resposta: <b>${E(chosen||'não respondida')}</b> · Gabarito: <b>${E(q.a||'—')}</b></span></div>${gab?`<div class="fb-gab"><small>Alternativa correta</small><div>${E(gab)}</div></div>`:''}<div class="fb-sec"><b>Comentário</b><p>${comment?E(comment).replace(/\n/g,'<br>'):'Esta questão ainda não tem comentário cadastrado.'}</p></div>${alts.length?`<div class="fb-sec"><b>Análise das alternativas</b><ul class="fb-alts">${alts.map(a=>{const ok=a.k===q.a;return `<li class="${ok?'alt-ok':'alt-no'}${a.k===chosen?' alt-mine':''}"><strong>${ok?'✔':'✘'} ${E(a.k)})</strong> ${E(a.t)}${a.k===chosen?' <em>(sua escolha)</em>':''}</li>`}).join('')}</ul></div>`:''}`}
function finish(){acc();if(run.mode==='sim')run.l.forEach(q=>{if(run.sel[q.i]&&!run.done[q.i])rec(q)});
 const simH=run.mode==='sim'?run.l.map((q,i)=>{const ch=run.sel[q.i],st=!ch?'Em branco':ch===q.a?'Acertou':'Errou';return `<div class="card"><span class="tag">Questão ${i+1} · ${st}</span><p class="st">${E(q.s)}</p><div class="fb-res">${explM(q,ch)}</div></div>`}).join(''):'';
 const an=run.l.filter(q=>run.done[q.i]),ok=an.filter(q=>run.sel[q.i]===q.a).length,w=an.filter(q=>run.sel[q.i]!==q.a),tot=Object.values(run.ms).reduce((a,b)=>a+b,0);
 V(`<div class="card"><b>${E(run.label)} concluído</b><p>${ok} acertos · ${w.length} erros · ${run.l.length-an.length} em branco</p><p class="mut">Tempo nas questões: ${fmt(tot)} (${an.length?Math.round(tot/an.length/1000):0} s por questão)</p></div>
 ${run.mode==='sim'?simH:w.map(q=>`<div class="card"><small>${E(q.t)}</small><p class="st">${E(q.s.slice(0,220))}${q.s.length>220?'…':''}</p><p>Você: <b>${E(run.sel[q.i])}</b> · Gabarito: <b>${E(q.a)}</b></p></div>`).join('')}`);S.run=null;save();run=null}
// Pendente de revisão = a ÚLTIMA resposta foi errada (ou a questão está marcada). Acertou na revisão: sai da lista.
const lastWrong=()=>{const m=new Map();[...S.ans].sort((a,b)=>a.t<b.t?-1:a.t>b.t?1:0).forEach(a=>m.set(a.q,!a.ok));return new Set([...m].filter(([,w])=>w).map(([q])=>q))};
let RG='todas';
// Grupos da revisão (dentro de cada categoria): err = última resposta errada · acm = marcada e acertou · sem = marcada e ainda sem resposta
const revG=(k,g='todas')=>{const lw=lastWrong(),done=new Set(S.ans.map(a=>a.q));return bank.filter(q=>{if(q.k!==k)return false;const cd=cardOfQ(q.i);if(cd&&cd.state!=='rascunho')return false;const err=lw.has(q.i),m=S.marks.includes(q.i);return g==='err'?err:g==='acm'?m&&!err&&done.has(q.i):g==='sem'?m&&!done.has(q.i):(err||m)})};
const revL=k=>revG(k,'todas');
function rev(){if(RG==='sem'&&!revG(RK,'sem').length)RG='todas';
 const l=revG(RK,RG),lw=lastWrong(),done=new Set(S.ans.map(a=>a.q)),n=g=>revG(RK,g).length,
 chips=[['todas','Todas'],['err','✘ Errei'],['acm','★ Acertei, mas marquei'],['sem','★ Marcadas sem responder']].filter(([g])=>g!=='sem'||n('sem')>0),
 badge=q=>(lw.has(q.i)?'<span class="bd r">✘ errei</span>':done.has(q.i)?'<span class="bd ok">✔ acertei</span>':'<span class="bd n">sem resposta</span>')+(S.marks.includes(q.i)?'<span class="bd g">★ marcada</span>':'');
 V(`<button class="ghost fcgo" onclick="fcView()">🃏 Flashcards${CARDS.length&&fcDueList(CARDS).length?' · '+fcDueList(CARDS).length+' para revisar':''}</button><div class="card"><b>Revisar erros e marcadas</b><div class="seg">${['Básicas','Específicas'].map(k=>`<button class="${RK===k?'on':''}" onclick="RK='${k}';rev()">${k} (${revL(k).length})</button>`).join('')}</div>
 <div class="seg wrap">${chips.map(([g,lb])=>`<button class="${RG===g?'on':''}" onclick="RG='${g}';rev()">${lb} (${n(g)})</button>`).join('')}</div>
 <button class="pri" style="width:100%" ${l.length?'':'disabled'} onclick="begin(revG(RK,RG),'rev','Revisão · '+RK)">Estudar estas ${l.length} questões</button></div>
 ${l.slice(0,40).map(q=>`<div class="card"><div>${badge(q)}</div><small>${E(q.t)}</small><p class="st">${E(q.s.slice(0,160))}${q.s.length>160?'…':''}</p></div>`).join('')||'<div class="card"><p class="mut">Nada pendente neste grupo. Continue praticando!</p></div>'}
 <div class="card"><b>Backup do progresso</b><p class="mut">Os dados ficam só neste navegador (${S.ans.length} respostas, ${Math.round(JSON.stringify(S).length/1024)} KB). Use <b>Salvar arquivo</b>: ele guarda tudo, sem limite de tamanho. Não use apps de notas, que cortam o texto perto de 20.000 caracteres.</p><div class="row"><button class="pri" onclick="bkFile()">Salvar arquivo</button><label class="ghost" style="cursor:pointer">Restaurar de arquivo<input type="file" accept=".json,application/json,text/plain" hidden onchange="bkLoad(this.files[0])"></label></div><details><summary class="mut">Copiar como texto (backups pequenos)</summary><textarea id="bk" rows="4"></textarea><div class="row"><button class="ghost" onclick="bkOut()">Copiar texto</button><button class="ghost" onclick="bkIn()">Restaurar do texto</button></div></details></div>
 <div class="card"><b>Banco de questões</b><p class="mut">${bank.length} questões neste aparelho.</p><button class="ghost" onclick="imp()">Importar outro banco</button></div>`)}
function bkOut(){const t=JSON.stringify(S);$('#bk').value=t;$('#bk').select();try{navigator.clipboard.writeText(t).then(()=>toast('Copiado'),()=>toast('Selecione e copie o texto'))}catch(e){toast('Selecione e copie o texto')}}
function bkApply(txt){const a=txt.indexOf('{'),b=txt.lastIndexOf('}');let d;try{d=JSON.parse(txt.slice(a,b+1))}catch(e){return toast('Arquivo ou texto inválido (cortado?)')}
 if(!Array.isArray(d.ans)&&Array.isArray(d.answers)){const MM={study:'study',simulado:'sim',revisao:'rev'};d={...d,ans:d.answers.map(x=>({q:x.questionId,a:x.answer,ok:!!x.correct,t:x.at,ms:x.timeMs||0,m:MM[x.mode]||'study',r:x.reason||null,c:x.confidence||null})),cards:d.flashcards||[],reviews:(d.fcReviews||[]).map(r=>({fc:r.fc,at:r.at,result:r.result,prev:r.prev,next:r.next,due:r.due}))}}
 if(!Array.isArray(d.ans))return toast('Não parece um backup do StudyQuest');
 const cs=Array.isArray(d.cards)?d.cards:[];cs.forEach(c=>{if(!c||!c.id)return;const o=CARDS.findIndex(x=>x.id===c.id);if(o<0)CARDS.push(c);else if((c.updated||'')>(CARDS[o].updated||''))CARDS[o]=c});saveCards();
 const rs=Array.isArray(d.reviews)?d.reviews:[],rk=r=>r.fc+'|'+r.at,rset=new Set(FCR.map(rk));rs.forEach(r=>{if(r&&!rset.has(rk(r))){FCR.push(r);rset.add(rk(r))}});FCR.sort((x,y)=>x.at<y.at?-1:1);saveFcr();
 const k=x=>x.q+'|'+x.t,have=new Set(S.ans.map(k));let n=0;d.ans.forEach(x=>{if(x&&x.q&&!have.has(k(x))){S.ans.push(x);have.add(k(x));n++}});
 (d.marks||[]).forEach(m=>{if(!S.marks.includes(m))S.marks.push(m)});S.ans.sort((x,y)=>x.t<y.t?-1:1);save();toast(n+' respostas somadas ao progresso');go('dash')}
function bkIn(){bkApply($('#bk').value)}
async function bkLoad(f){if(f)bkApply(await f.text())}
async function bkFile(){const txt=JSON.stringify({...S,cards:CARDS,reviews:FCR}),f=new File([txt],'backupquest-'+new Date().toISOString().slice(0,10)+'.json',{type:'application/json'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Backup StudyQuest'});return toast('Backup compartilhado')}}catch(e){if(e&&e.name==='AbortError')return}
 try{const u=URL.createObjectURL(f),l=document.createElement('a');l.href=u;l.download=f.name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Arquivo baixado: '+f.name)}catch(e){toast('Não consegui salvar o arquivo')}}
function imp(){V(`<div class="card"><b>Carregar o banco de questões</b><p class="mut">Escolha o arquivo <b>questoes-mobile.json</b> (enviado por Drive, WhatsApp ou cabo). Isso é feito uma única vez; depois o app funciona sem internet.</p><input type="file" id="bf" accept=".json,application/json"><p id="bm" class="mut"></p></div>`);
 $('#bf').onchange=e=>loadFile(e.target.files[0])}
async function loadFile(f){const m=$('#bm');setCtx('ace');try{const b=JSON.parse(await f.text());
 if(!Array.isArray(b)||!b.length||!b.every(q=>q.i&&q.s&&q.o))throw 0;await kv.set('bank',b);setBank(b);toast(b.length+' questões carregadas');go('dash')}catch(e){m.textContent='Arquivo inválido. Use o questoes-mobile.json gerado para o StudyQuest.'}}
// ---- pomodoro ----
const P={ph:'f',rem:0,run:false,end:0,tm:null,au:null},pm=p=>(p==='f'?S.cfg.f:p==='l'?S.cfg.l:S.cfg.b)*60;P.rem=pm('f');
function beep(k){if(!S.cfg.s)return;try{const A=window.AudioContext||window.webkitAudioContext;P.au=P.au||new A();P.au.resume();const t0=P.au.currentTime+.02;
 (k===1?[[880,0,.18],[880,.3,.18]]:[[660,0,.2],[880,.28,.2],[1175,.56,.35]]).forEach(([f,a,l])=>{const o=P.au.createOscillator(),g=P.au.createGain();o.frequency.value=f;g.gain.setValueAtTime(.0001,t0+a);g.gain.exponentialRampToValueAtTime(.35,t0+a+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+a+l);o.connect(g).connect(P.au.destination);o.start(t0+a);o.stop(t0+a+l+.05)})}catch(e){}}
function pr(){const m=Math.floor(P.rem/60),s=P.rem%60;$('#pt').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('#pp').textContent=P.ph==='f'?'Foco':P.ph==='l'?'Longo':'Intervalo';$('#pomo').classList.toggle('brk',P.ph!=='f');$('#pg').textContent=P.run?'⏸':'▶'}
const fsAdd=()=>{if(P.st){S.day.fs=(S.day.fs||0)+Math.round((Date.now()-P.st)/1000);P.st=0;save()}};
function pTick(){if(!P.run)return;P.rem=Math.max(0,Math.ceil((P.end-Date.now())/1000));if(P.rem>0)return pr();
 if(P.ph==='f'){fsAdd();S.day.fd++;beep(1);P.ph=S.day.fd%S.cfg.e===0?'l':'b';P.rem=pm(P.ph);P.end=Date.now()+P.rem*1000}else{S.day.cy++;beep(2);P.ph='f';P.rem=pm('f');pStop()}save();pr()}
function pToggle(){if(P.run)return pStop();try{const A=window.AudioContext||window.webkitAudioContext;P.au=P.au||new A();P.au.resume()}catch(e){}P.run=true;P.st=P.ph==='f'?Date.now():0;P.end=Date.now()+P.rem*1000;P.tm=setInterval(pTick,500);pr()}
function pStop(){fsAdd();P.run=false;clearInterval(P.tm);pr()}
function pReset(){pStop();P.ph='f';P.rem=pm('f');pr()}
document.addEventListener('visibilitychange',pTick);
[['cf','f'],['cb','b'],['cl','l'],['ce','e']].forEach(([id,k])=>{const e=$('#'+id);e.value=S.cfg[k];e.onchange=()=>{S.cfg[k]=Math.max(1,+e.value||1);save();if(!P.run){P.rem=pm(P.ph);pr()}}});
$('#ca').checked=!!S.cfg.a;$('#ca').onchange=e=>{S.cfg.a=e.target.checked?1:0;save()};$('#cs').checked=!!S.cfg.s;$('#cs').onchange=e=>{S.cfg.s=e.target.checked?1:0;save()};
pr();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
Promise.all([kv.get('bank'),kv.get('cards'),kv.get('fcrev'),kv.get('granBank')]).then(([b,c,r,g])=>{CARDS=c||[];FCR=r||[];GBANK=g||[];if(b&&b.length){setBank(b);go('dash')}else imp()}).catch(imp);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
